[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # server/db.js reads this file from disk at startup (fs.readFileSync)
  # to create the schema on first run. esbuild only bundles JS it can
  # see through `import`, so a plain data file like this has to be
  # listed explicitly or it won't ship with the deployed function and
  # every cold start will crash looking for it.
  included_files = ["server/schema.sql"]
  # @libsql/client picks its native binary (e.g. @libsql/linux-x64-gnu)
  # at runtime based on OS/architecture -- esbuild can't statically
  # bundle that, so it silently leaves the native binary out of the zip,
  # which crashes every cold start with "Cannot find module
  # '@libsql/linux-x64-gnu'". Marking it external tells Netlify to copy
  # the whole @libsql/client package (native binary included) into the
  # function bundle instead of trying to inline it with esbuild.
  external_node_modules = ["@libsql/client"]

# IMPORTANT: this redirect must come before the catch-all "/*" one below
# -- Netlify checks redirects top-to-bottom and uses the first match.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# React Router client-side routing -- any other path falls back to
# index.html so refreshing on e.g. /owner/dashboard doesn't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
